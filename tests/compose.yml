services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: gateway_test
      POSTGRES_USER: gateway_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Provide a temporary test password}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_test -d gateway_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.5-bookworm
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
