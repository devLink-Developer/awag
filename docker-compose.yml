name: whatsapp-gateway
x-backend: &backend
  image: whatsapp-gateway:0.1.0
  build:
    context: .
    dockerfile: docker/Dockerfile
  network_mode: host
  env_file: .env
  volumes:
    - ${HOST_DATA_DIR:-./data}/incoming:/data/incoming:ro
    - ${HOST_DATA_DIR:-./data}/media:/data/media
    - ${HOST_DATA_DIR:-./data}/screenshots:/data/screenshots
  restart: unless-stopped
  stop_grace_period: 330s

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [storage]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    # Read the password inside the container; never interpolate it into the Compose command.
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync always --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    networks: [storage]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  appium:
    image: whatsapp-gateway-appium:0.1.0
    build:
      context: .
      dockerfile: docker/Dockerfile.appium
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4723/status"]
      interval: 10s
      timeout: 3s
      retries: 20
  gateway-api:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "celery", "-A", "app.workers.celery_app:celery", "worker", "--concurrency=1", "--pool=prefork", "--loglevel=WARNING", "--without-gossip", "--without-mingle"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      appium: {condition: service_healthy}
  dispatcher:
    <<: *backend
    command: ["python", "-m", "app.events.dispatcher"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  storage:
    driver: bridge
volumes:
  postgres-data:
  redis-data:
